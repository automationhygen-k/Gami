name: Android CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-final-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Missing Wrapper
        # This step creates the missing gradle-wrapper.jar that caused your last error.
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          # The -P line fixes the "compileSdk 35" crash we saw in your log
          ./gradlew :app:assembleDebug \
            -Pandroid.suppressUnsupportedCompileSdk=35 \
            --stacktrace \
            --warning-mode all | tee build.log

      - name: Package final APK
        if: success()
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found"
            exit 1
          fi
          cp "${APK_PATH}" dist/Gami-final.apk

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gami-build-output
          path: |
            dist/Gami-final.apk
            build.log
