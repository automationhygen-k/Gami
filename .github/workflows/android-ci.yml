name: Android CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-final-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build one installable APK (single compile action)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --warning-mode all | tee build.log

      - name: Package final APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "${APK_PATH}" dist/Gami-final.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Gami-final-apk
          path: dist/Gami-final.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
