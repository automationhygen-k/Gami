name: Android CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-final-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          # Using ./gradlew ensures the correct Gradle version is used
          ./gradlew :app:assembleDebug --stacktrace --warning-mode all | tee build.log

      - name: Package final APK
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found"
            exit 1
          fi
          cp "${APK_PATH}" dist/Gami-final.apk

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gami-build-output
          path: |
            dist/Gami-final.apk
            build.log
