name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-final-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Validate textures (power-of-two)
        run: gradle verifyTexturesPowerOfTwo --stacktrace

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package final APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gami-final.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Gami-final-apk
          path: dist/Gami-final.apk
          if-no-files-found: error
